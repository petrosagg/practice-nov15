    <script>
      // If the app fails to start (a phone has no developer console), show why instead of a
      // blank page.
      (function () {
        function show(message) {
          var box = document.getElementById("boot-error");
          if (!box) {
            box = document.createElement("pre");
            box.id = "boot-error";
            box.style.cssText = "white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;padding:16px;margin:16px;border:1px solid #d03b3b;border-radius:8px;color:#d03b3b";
            box.textContent = "The app could not start:\n";
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += "\n" + message;
        }
        window.addEventListener("error", function (e) {
          show((e.message || "error") + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && (e.reason.stack || e.reason))); });
        // A Rust panic reaches the browser as "unreachable executed"; the panic message itself
        // goes to console.error, so show that too.
        var consoleError = console.error;
        console.error = function () {
          var text = Array.prototype.join.call(arguments, " ");
          if (text.indexOf("panicked at") >= 0) show(text.split("\n\nStack:")[0]);
          return consoleError.apply(console, arguments);
        };
        setTimeout(function () {
          if (!document.querySelector(".rp, .rp-loading")) show("Still not running after 20 s: " + navigator.userAgent);
        }, 20000);
      })();
    </script>
